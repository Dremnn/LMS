<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGradient)" />

  <!-- Ambient circles -->
  <circle cx="90" cy="70" r="140" fill="#818CF8" opacity="0.25" filter="url(#glow)" />
  <circle cx="530" cy="300" r="160" fill="#22D3EE" opacity="0.2" filter="url(#glow)" />
  <circle cx="480" cy="50" r="90" fill="#A78BFA" opacity="0.2" />

  <!-- Center Glass Card -->
  <rect x="120" y="55" width="360" height="250" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Graduation Cap Icon -->
  <g transform="translate(300, 140)">
    <!-- Cap top diamond -->
    <path d="M 0,-42 L 62,-16 L 0,10 L -62,-16 Z" fill="#FFFFFF" />
    <!-- Cap under visor / skull cap -->
    <path d="M -38,-5 L -38,20 C -38,36 38,36 38,20 L 38,-5 C 26,12 -26,12 -38,-5 Z" fill="#E0E7FF" />
    <!-- Tassel string & drop -->
    <path d="M 0,-16 L 56,12 L 56,38" stroke="#FDE047" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="56" cy="41" r="3.5" fill="#FACC15" />
  </g>

  <!-- Text -->
  <text x="300" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    UTEdu COURSE
  </text>
  <text x="300" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#E0E7FF" letter-spacing="0.5">
    NỀN TẢNG HỌC TRỰC TUYẾN
  </text>
</svg>
